# Installed as /etc/ssh/sshd_config.d/050-remote-access.conf by
# deploy-remote-access.zsh, which fills in the account name. It sorts before
# Apple's 100-macos.conf because sshd keeps the first value it reads, and it
# has no effect until Remote Login is turned on.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowUsers __REMOTE_USER__
