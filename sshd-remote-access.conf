# Installed as /etc/ssh/sshd_config.d/050-remote-access.conf by deploy-remote-access.zsh.
# The script fills in the account name. The file sorts before Apple's
# 100-macos.conf because sshd keeps the first value it reads, and it has no
# effect until Remote Login is turned on. MaxAuthTries stays at the default (6):
# a lower limit only locks out clients whose agent offers several keys first.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
PermitEmptyPasswords no
LoginGraceTime 30
X11Forwarding no
AllowUsers __REMOTE_USER__
