# Remote-access reply routing for SSH that reaches this Mac from outside the LAN.
# network-remote-access-pf.sh loads this file into anchor com.apple/400.RemoteAccess,
# which the stock /etc/pf.conf already evaluates through `anchor "com.apple/*"`.
#
# While Wi-Fi is unavailable the route guard rejects 0.0.0.0/1 and 128.0.0.0/1
# through lo0, and macOS keeps loopback routes even for lookups scoped to en0.
# reply-to hands the replies of these connections to the wired gateway anyway.
# Owner-approved exception (2026-09-26); all other foreign traffic is unchanged.

table <remote_access_abusers> persist

block drop in quick on en0 inet proto tcp from <remote_access_abusers> \
  to 192.168.1.100 port 22

# More than 10 new connections per minute, or 10 at once, from one source puts
# it in <remote_access_abusers>; the loader expires entries after an hour.
pass in quick on en0 reply-to (en0 192.168.1.1) inet proto tcp \
  from ! 192.168.1.0/24 to 192.168.1.100 port 22 flags S/SA keep state \
  (max-src-conn 10, max-src-conn-rate 10/60, \
   overload <remote_access_abusers> flush global)
