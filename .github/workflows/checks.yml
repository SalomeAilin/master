name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      NETWORK_SPLIT_LIVE: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Go formatting
        working-directory: engine
        run: test -z "$(gofmt -l .)"
      - name: Go race tests
        working-directory: engine
        run: go test -race -timeout 5m ./...
      - name: Go vet
        working-directory: engine
        run: go vet ./...
      - name: Native launchd definition acceptance
        working-directory: engine
        run: |
          probe="$RUNNER_TEMP/network-service.test"
          trap 'rm -f "$probe"' EXIT
          go test -c -o "$probe" ./internal/service
          sudo env NETWORK_SPLIT_LAUNCHD_TEST=1 "$probe" -test.run '^TestLaunchdAcceptsGeneratedDefinitions$' -test.v
      - name: Offline integration
        working-directory: engine
        run: go test -tags integration -run Integration -timeout 5m .
      - name: Remote access configuration regression
        run: zsh tests/remote_access.zsh
      - name: Patch whitespace
        run: git diff --check
