# Local split DNS for Wi-Fi international + Ethernet domestic routing.
port=53
listen-address=127.0.0.1,192.168.1.100
bind-interfaces
no-resolv
filter-AAAA
domain-needed
bogus-priv
stop-dns-rebind
dns-loop-detect
local-service
cache-size=10000

# Default: international DNS via Wi-Fi default route.
server=1.0.0.1
server=8.8.8.8
server=1.1.1.1

